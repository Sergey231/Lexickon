services:
  postgres:
    image: postgres:16-alpine
    container_name: lexicon-api-postgres
    environment:
      POSTGRES_DB: lexicon
      POSTGRES_USER: lexicon
      POSTGRES_PASSWORD: lexicon
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexicon -d lexicon"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
